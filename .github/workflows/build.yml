name: Xcode - Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: Upload IPAs to a GitHub Release (tag nightly)
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Build LiveContainer IPA
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      has_sidestore: ${{ steps.pack.outputs.has_sidestore }}

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve project
        id: proj
        run: |
          if ls -A | grep -qi '\.xcworkspace$'; then
            echo "filetype=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcworkspace$' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "filetype=project" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcodeproj$' | head -1)" >> "$GITHUB_OUTPUT"
          fi
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -${{ steps.proj.outputs.filetype }} "${{ steps.proj.outputs.file }}" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            | xcpretty
          echo "==> Archive tree:"
          find "${archive_path}.xcarchive/Products" -maxdepth 4 -type d || true

      - name: Pack IPA
        id: pack
        run: |
          chmod +x .github/build_github.sh
          sh .github/build_github.sh
          echo "==> Workspace IPAs:"
          ls -lh *.ipa || true
          if [ -f "${scheme}+SideStore.ipa" ]; then
            echo "has_sidestore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sidestore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload LiveContainer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer.ipa
          path: LiveContainer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload LiveContainer+SideStore.ipa
        if: steps.pack.outputs.has_sidestore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer+SideStore.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload archive (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-debug
          path: ${{ env.archive_path }}.xcarchive
          if-no-files-found: ignore
          retention-days: 5

  release:
    name: Publish Release
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download LiveContainer.ipa
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer.ipa

      - name: Download +SideStore (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa

      - name: List files
        run: ls -lah

      - name: Create / update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          generate_release_notes: true
          files: |
            LiveContainer.ipa
            LiveContainer+SideStore.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
