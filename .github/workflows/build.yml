name: Xcode - Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish IPAs to GitHub Release (tag: nightly)"
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Build LiveContainer IPA
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      has_sidestore: ${{ steps.pack.outputs.has_sidestore }}

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve project
        id: proj
        run: |
          if ls -A | grep -qi '\.xcworkspace$'; then
            echo "filetype=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcworkspace$' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "filetype=project" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcodeproj$' | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive
        run: |
          set -o pipefail
          # Avoid FetchProvisioningProfilesOperation / invalid team AAAAA11111 on CI
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -${{ steps.proj.outputs.filetype }} "${{ steps.proj.outputs.file }}" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            | xcpretty
          echo "==> Archive tree:"
          find "${archive_path}.xcarchive/Products" -maxdepth 4 -type d || true

      - name: Pack IPA
        id: pack
        run: |
          chmod +x .github/build_github.sh
          sh .github/build_github.sh
          echo "==> Workspace IPAs:"
          ls -lh *.ipa || true
          if [ -f "${scheme}+SideStore.ipa" ]; then
            echo "has_sidestore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sidestore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload LiveContainer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer.ipa
          path: LiveContainer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload LiveContainer+SideStore.ipa
        if: steps.pack.outputs.has_sidestore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer+SideStore.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload archive (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-debug
          path: ${{ env.archive_path }}.xcarchive
          if-no-files-found: ignore
          retention-days: 5

  release:
    name: Publish Release
    needs: [build]
    # Release when:
    #  - push to main/master succeeds
    #  - OR manual workflow_dispatch with create_release enabled (default true)
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download LiveContainer.ipa
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer.ipa

      - name: Download +SideStore (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa

      - name: Prepare release files
        id: files
        run: |
          ls -lah
          if [ ! -f LiveContainer.ipa ]; then
            echo "ERROR: LiveContainer.ipa missing after download"
            exit 1
          fi
          # softprops fails if a listed file is missing — only include existing ones
          {
            echo "files<<EOF"
            echo "LiveContainer.ipa"
            if [ -f "LiveContainer+SideStore.ipa" ]; then
              echo "LiveContainer+SideStore.ipa"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Upload list:"
          cat <<LIST
          LiveContainer.ipa
          $([ -f LiveContainer+SideStore.ipa ] && echo LiveContainer+SideStore.ipa)
          LIST

      - name: Create / update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "LiveContainer Extended — Nightly"
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.files.outputs.files }}
          body: |
            **LiveContainer Extended** nightly build

            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Install via SideStore / TrollStore / iloader (ad-hoc signed).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
