name: Xcode - Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub Release"
        type: boolean
        required: false
        default: true
      release_channel:
        description: "Release channel"
        type: choice
        options:
          - stable
          - nightly
        default: stable
      version_bump:
        description: "Semver bump type"
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      release_name:
        description: "Release title (e.g. 4.3.0 — Onboarding & App Lock)"
        type: string
        required: false
        default: ""
      summary:
        description: "Short summary (one paragraph)"
        type: string
        required: false
        default: ""
      features:
        description: "New Features (one bullet per line)"
        type: string
        required: false
        default: ""
      improvements:
        description: "Improvements (one bullet per line)"
        type: string
        required: false
        default: ""
      bug_fixes:
        description: "Bug Fixes (one bullet per line)"
        type: string
        required: false
        default: ""
      notes:
        description: "Extra notes / warnings"
        type: string
        required: false
        default: ""
      make_latest:
        description: "Mark as latest release on GitHub"
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Build LiveContainer IPA
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      has_sidestore: ${{ steps.pack.outputs.has_sidestore }}
      sidestore_version: ${{ steps.pack.outputs.sidestore_version }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version (semver)
        id: version
        run: |
          set -e
          BASE="4.1.8"
          if [ -f VERSION ]; then
            BASE=$(tr -d '[:space:]' < VERSION)
          fi
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
          fi
          BUMP="${{ github.event.inputs.version_bump }}"
          if [ -z "$BUMP" ]; then BUMP="patch"; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BUMP="none"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BUMP="patch"
          elif [ "${{ inputs.release_channel }}" = "nightly" ]; then
            BUMP="none"
          fi
          IFS=. read -r MAJ MIN PAT <<EOF
          $BASE
          EOF
          MAJ=${MAJ:-4}; MIN=${MIN:-1}; PAT=${PAT:-8}
          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
            none) ;;
            *) PAT=$((PAT+1)) ;;
          esac
          VER="${MAJ}.${MIN}.${PAT}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "$VER" > VERSION
          echo "==> Version: $VER (bump=$BUMP, base was $BASE)"
          if [ -f LiveContainer/Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" LiveContainer/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" LiveContainer/Info.plist || true
          fi

      - name: Resolve project
        id: proj
        run: |
          if ls -A | grep -qi '\.xcworkspace$'; then
            echo "filetype=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcworkspace$' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "filetype=project" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcodeproj$' | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -${{ steps.proj.outputs.filetype }} "${{ steps.proj.outputs.file }}" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            | xcpretty
          echo "==> Archive tree:"
          find "${archive_path}.xcarchive/Products" -maxdepth 4 -type d || true

      - name: Pack IPA (require +SideStore)
        id: pack
        run: |
          set -euo pipefail
          chmod +x .github/build_github.sh

          MAX_ATTEMPTS=5
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "==> Pack attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            rm -f "${scheme}.ipa" "${scheme}+SideStore.ipa" sidestore_version.txt
            rm -rf Payload tmp

            set +e
            sh .github/build_github.sh
            PACK_RC=$?
            set -e

            if [ -f "${scheme}.ipa" ] && [ -f "${scheme}+SideStore.ipa" ]; then
              echo "==> Both IPAs present"
              break
            fi

            echo "WARNING: missing IPA(s) after attempt ${ATTEMPT} (rc=${PACK_RC})"
            ls -lah *.ipa 2>/dev/null || true
            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "ERROR: LiveContainer+SideStore.ipa still missing after ${MAX_ATTEMPTS} attempts"
              exit 1
            fi
            sleep $((ATTEMPT * 15))
            ATTEMPT=$((ATTEMPT + 1))
          done

          ls -lh *.ipa
          echo "has_sidestore=true" >> "$GITHUB_OUTPUT"

          if [ -f sidestore_version.txt ]; then
            SS_VER=$(tr -d '\r\n' < sidestore_version.txt)
          else
            SS_VER="unknown"
          fi
          echo "sidestore_version=$SS_VER" >> "$GITHUB_OUTPUT"
          echo "==> LiveContainer version: ${{ steps.version.outputs.version }}"
          echo "==> SideStore embedded: $SS_VER"
          {
            echo "livecontainer=${{ steps.version.outputs.version }}"
            echo "sidestore=$SS_VER"
          } > build_versions.txt

      - name: Upload LiveContainer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer.ipa
          path: LiveContainer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload LiveContainer+SideStore.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer+SideStore.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-debug
          path: ${{ env.archive_path }}.xcarchive
          if-no-files-found: ignore
          retention-days: 5

  release:
    name: Publish Release
    needs: [build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for VERSION commit optional + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download LiveContainer.ipa
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer.ipa

      - name: Download LiveContainer+SideStore.ipa
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa

      - name: Require both IPAs
        run: |
          set -euo pipefail
          ls -lah
          test -f LiveContainer.ipa
          test -f LiveContainer+SideStore.ipa
          echo "Both IPAs present for release"

      - name: Prepare release data (tag, changelog, files)
        id: prep
        run: |
          set -euo pipefail

          VER="${{ needs.build.outputs.version }}"
          SS_VER="${{ needs.build.outputs.sidestore_version }}"
          if [ -z "$SS_VER" ]; then SS_VER="unknown"; fi
          if [ -z "$VER" ]; then
            echo "No version found from build job; aborting release prep"
            exit 1
          fi

          CHANNEL="${{ inputs.release_channel }}"
          if [ -z "$CHANNEL" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              CHANNEL="stable"
            else
              CHANNEL="nightly"
            fi
          fi

          git fetch --tags origin || true

          if [ "$CHANNEL" = "nightly" ]; then
            TAG="nightly"
            TITLE="${VER}"
            COMMIT_MSG=$(git log -1 --pretty=%s)
            cat > release_body.txt <<EOF
          Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          Message: ${COMMIT_MSG}

          | Component | Version |
          |-----------|---------|
          | **LiveContainer Extended** | \`${VER}\` |
          | **Embedded SideStore** | \`${SS_VER}\` |

          This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF
          else
            TAG="v${VER}"
            RELNAME="${{ inputs.release_name }}"
            if [ -n "$RELNAME" ]; then
              TITLE="$RELNAME"
            else
              TITLE="${VER}"
            fi

            if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              SUFFIX=$(date -u +%Y%m%d%H%M)
              TAG="${TAG}-${SUFFIX}"
              echo "Tag collision: using fallback tag ${TAG}"
            fi

            FEATURES="${{ inputs.features }}"
            IMPROVEMENTS="${{ inputs.improvements }}"
            BUGFIXES="${{ inputs.bug_fixes }}"
            SUMMARY="${{ inputs.summary }}"
            NOTES="${{ inputs.notes }}"

            bullets() { echo "$1" | sed '/^[[:space:]]*$/d' | sed 's/^/- /'; }
            FEAT_MD=$(bullets "$FEATURES")
            IMP_MD=$(bullets "$IMPROVEMENTS")
            BUG_MD=$(bullets "$BUGFIXES")

            cat > release_body.txt <<EOF
          # ${RELNAME:-LiveContainer Extended ${VER}}

          | Component | Version |
          |-----------|---------|
          | **LiveContainer Extended** | \`${VER}\` |
          | **Embedded SideStore** | \`${SS_VER}\` |

          ${SUMMARY}

          > [!Warning]
          > Standalone build needs **SideStore 0.6.2+** or **AltStore 2.2.1+**.
          > For \`LiveContainer+SideStore.ipa\` use [Impactor](https://github.com/khcrysalis/Impactor) or [iloader](https://github.com/nab138/iloader).

          ## New Features

          ${FEAT_MD:-- (none listed)}

          ## Improvements

          ${IMP_MD:-- (none listed)}

          ## Bug Fixes

          ${BUG_MD:-- (none listed)}

          ## Notes

          ${NOTES:--}

          ## Credits
          - **Lead Developer:** Nguyen Quang Dung
          - Based on [LiveContainer](https://github.com/LiveContainer/LiveContainer)
          EOF
          fi

          test -f LiveContainer.ipa
          test -f LiveContainer+SideStore.ipa

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "body_path=release_body.txt" >> "$GITHUB_OUTPUT"

      - name: Install gh (GitHub CLI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Create GitHub Release (using gh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHANNEL="${{ steps.prep.outputs.channel }}"
          TAG="${{ steps.prep.outputs.tag }}"
          TITLE="${{ steps.prep.outputs.title }}"
          NOTES_FILE="${{ steps.prep.outputs.body_path }}"

          test -f LiveContainer.ipa
          test -f LiveContainer+SideStore.ipa

          if [ "${CHANNEL}" = "nightly" ]; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}" --force
          fi

          ASSETS=(LiveContainer.ipa "LiveContainer+SideStore.ipa")

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and assets"
            if [ "${CHANNEL}" = "nightly" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --prerelease
            else
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
            fi
            for a in "${ASSETS[@]}"; do
              gh release upload "$TAG" "$a" --clobber
            done
          else
            echo "Creating release $TAG with title: $TITLE"
            if [ "${CHANNEL}" = "nightly" ]; then
              gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --prerelease "${ASSETS[@]}"
            else
              gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --latest "${ASSETS[@]}"
            fi
          fi

          gh release view "$TAG" --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          grep -qx 'LiveContainer.ipa' /tmp/assets.txt
          grep -qx 'LiveContainer+SideStore.ipa' /tmp/assets.txt
          echo "Release $TAG verified with both IPAs"
