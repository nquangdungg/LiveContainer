name: Xcode - Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish GitHub Release (semver bump)"
        type: boolean
        required: false
        default: true
      version_bump:
        description: "Semver bump type"
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch

jobs:
  build:
    name: Build LiveContainer IPA
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      has_sidestore: ${{ steps.pack.outputs.has_sidestore }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version (semver)
        id: version
        run: |
          set -e
          BASE="4.1.8"
          if [ -f VERSION ]; then
            BASE=$(tr -d '[:space:]' < VERSION)
          fi
          # Prefer latest semver tag vX.Y.Z if present
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
          fi
          BUMP="${{ github.event.inputs.version_bump }}"
          if [ -z "$BUMP" ]; then BUMP="patch"; fi
          # PR: never bump, just build BASE
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BUMP="none"
          fi
          IFS=. read -r MAJ MIN PAT <<EOF
          $BASE
          EOF
          MAJ=${MAJ:-4}; MIN=${MIN:-1}; PAT=${PAT:-8}
          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
            none) ;;
            *) PAT=$((PAT+1)) ;;
          esac
          VER="${MAJ}.${MIN}.${PAT}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "$VER" > VERSION
          echo "==> Version: $VER (bump=$BUMP, base was $BASE)"
          # Inject into Info.plist if present
          if [ -f LiveContainer/Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" LiveContainer/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" LiveContainer/Info.plist || true
          fi

      - name: Resolve project
        id: proj
        run: |
          if ls -A | grep -qi '\.xcworkspace$'; then
            echo "filetype=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcworkspace$' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "filetype=project" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcodeproj$' | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -${{ steps.proj.outputs.filetype }} "${{ steps.proj.outputs.file }}" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            | xcpretty
          echo "==> Archive tree:"
          find "${archive_path}.xcarchive/Products" -maxdepth 4 -type d || true

      - name: Pack IPA
        id: pack
        run: |
          chmod +x .github/build_github.sh
          sh .github/build_github.sh
          ls -lh *.ipa || true
          if [ -f "${scheme}+SideStore.ipa" ]; then
            echo "has_sidestore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sidestore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload LiveContainer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer.ipa
          path: LiveContainer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload LiveContainer+SideStore.ipa
        if: steps.pack.outputs.has_sidestore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer+SideStore.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload archive (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-debug
          path: ${{ env.archive_path }}.xcarchive
          if-no-files-found: ignore
          retention-days: 5

  release:
    name: Publish Release
    needs: [build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for VERSION commit optional)
        uses: actions/checkout@v4

      - name: Download LiveContainer.ipa
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer.ipa

      - name: Download +SideStore (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa

      - name: Prepare release
        id: prep
        run: |
          VER="${{ needs.build.outputs.version }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          ls -lah
          {
            echo "files<<EOF"
            echo "LiveContainer.ipa"
            if [ -f "LiveContainer+SideStore.ipa" ]; then
              echo "LiveContainer+SideStore.ipa"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "LiveContainer Extended ${{ steps.prep.outputs.version }}"
          prerelease: false
          draft: false
          generate_release_notes: true
          files: ${{ steps.prep.outputs.files }}
          body: |
            ## LiveContainer Extended ${{ steps.prep.outputs.version }}

            **SemVer** release (see https://semver.org/)

            - Tag: `v${{ steps.prep.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Install
            SideStore · TrollStore · iloader (ad-hoc signed IPA)

            ### Credits
            - **Lead Developer:** Nguyen Quang Dung
            - Based on LiveContainer (original authors & contributors)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
